# Install as /opt/proxy/conf.d/63-colortheory.conf on the18th.
# Issue the certificate before enabling the HTTPS server block:
# sudo /opt/proxy/50_issue_cert.sh <existing-account-email> colortheory.petarpetkov.com

server {
  listen 80;
  listen [::]:80;
  server_name colortheory.petarpetkov.com;

  include /etc/nginx/snippets/acme-challenge.inc;

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  server_name colortheory.petarpetkov.com;

  ssl_certificate /etc/letsencrypt/live/colortheory.petarpetkov.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/colortheory.petarpetkov.com/privkey.pem;

  include /etc/nginx/snippets/acme-challenge.inc;

  location / {
    proxy_pass http://color-theory-web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
